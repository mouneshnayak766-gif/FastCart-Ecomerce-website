
server.port=8081

spring.devtools.restart.enabled=false
spring.main.lazy-initialization=true

spring.datasource.url=jdbc:mysql://localhost:3306/fastcart
spring.datasource.username=root
spring.datasource.password=Next@123

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

admin.email=admin123@gmail.com
admin.password=1234567

# ─────────────────────────────────────────────────────
# application.properties — required additions for FastCart JWT
# ─────────────────────────────────────────────────────

# Generate a real secret: openssl rand -hex 32
# NEVER commit a real value to git. Use environment variable injection in prod:
# jwt.secret=${JWT_SECRET}
jwt.secret=replace-this-with-a-real-64-char-secret-from-openssl-rand-hex-32

# CORS: override per environment
# Dev:  cors.allowed-origin=http://localhost:5173
# Prod: cors.allowed-origin=https://fastcart.vercel.app
# Test: cors.allowed-origin=*
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}