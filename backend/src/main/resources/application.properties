
server.port=8081

spring.devtools.restart.enabled=false
spring.main.lazy-initialization=true

spring.datasource.url=jdbc:mysql://localhost:3306/fastcart
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

admin.email=admin123@gmail.com
admin.password=1234567



jwt.secret=12345678901234567890123456789012


# CORS: override per environment
# Dev:  cors.allowed-origin=http://localhost:5173
# Prod: cors.allowed-origin=https://fastcart.vercel.app
# Test: cors.allowed-origin=*
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# ── Razorpay Credentials ─────────────────────────────────────────
# Get these from: https://dashboard.razorpay.com/app/keys
#
# TEST MODE (development) — prefix is "rzp_test_"
# LIVE MODE (production)  — prefix is "rzp_live_"
#
# NEVER commit live credentials to git.
# Use environment variable injection in production:
#   razorpay.key.id=${RAZORPAY_KEY_ID}
#   razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}


